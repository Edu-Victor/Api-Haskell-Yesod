name: biblioteca-api
version: 0.1.0


dependencies:
  - base
  - yesod
  - persistent
  - persistent-postgresql
  - text
  - aeson
  - time
  - http-conduit
  - http-types
  - bytestring
  - monad-logger

language: GHC2021


default-extensions:
  - OverloadedStrings
  - TemplateHaskell
  - QuasiQuotes
  - TypeFamilies
  - GADTs
  - DataKinds
  - DerivingStrategies
  - UndecidableInstances
  - ViewPatterns

executables:
  biblioteca-api:
    main: Main.hs
    source-dirs: src
    ghc-options:
      - -threaded
